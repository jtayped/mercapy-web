# production, as deployed by coolify (project `mercapy`, service `mercapy-collector`).
# postgres 18 is a separate coolify-managed database resource (`mercapy-db`) on the
# same docker network, so this file has no db service; DATABASE_URL points at it.
# the image is built by .github/workflows/release.yml on every push to main and
# coolify pulls `:main` on redeploy. the web joins here in a later step.
services:
  migrate:
    image: ghcr.io/jtayped/mercapy-collector:${TAG:-main}
    pull_policy: always
    restart: 'no'
    # migrate, seed the inactive warehouse list, import geonames once: every
    # step is idempotent, so it runs on each deploy.
    command: ['collector', 'bootstrap']
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed postgres}
      MERCAPY_USER_AGENT: ${MERCAPY_USER_AGENT:?set MERCAPY_USER_AGENT with a contact address}
      TZ: UTC
    networks:
      - coolify

  collector:
    image: ghcr.io/jtayped/mercapy-collector:${TAG:-main}
    pull_policy: always
    restart: unless-stopped
    # supercronic as pid 1 tries to re-exec itself to reap children and fails
    # under the unprivileged user; tini as pid 1 reaps instead.
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed postgres}
      MERCAPY_USER_AGENT: ${MERCAPY_USER_AGENT:?set MERCAPY_USER_AGENT with a contact address}
      MERCAPY_LANGUAGE: ${MERCAPY_LANGUAGE:-ca}
      MERCAPY_REQUEST_INTERVAL: ${MERCAPY_REQUEST_INTERVAL:-0.5}
      MERCAPY_STALE_HOURS: ${MERCAPY_STALE_HOURS:-72}
      MERCAPY_DISCONTINUED_DAYS: ${MERCAPY_DISCONTINUED_DAYS:-14}
      TZ: UTC
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - coolify

# the managed database lives on coolify's own network; joining it explicitly is
# what makes its container name resolve from these containers.
networks:
  coolify:
    external: true
