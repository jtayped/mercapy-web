[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "collector"
version = "0.1.0"
description = "daily collector of mercadona's online warehouse catalogs"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "mercapy>=2.2,<3",
  "psycopg[binary]>=3.3.5,<4",
]

[project.scripts]
collector = "collector.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.23",
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
  "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
