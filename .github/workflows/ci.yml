name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mercapy_test
          POSTGRES_USER: mercapy
          POSTGRES_PASSWORD: mercapy-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercapy -d mercapy_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # the committed json schema has to be what the contract exports.
      - run: pnpm contract:schema && git diff --exit-code packages/contract/schema
      # and the committed migration has to be what the drizzle schema generates.
      - run: pnpm --filter @mercapy/db check
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://mercapy:mercapy-ci@localhost:5432/mercapy_test
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collector
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
