name: setup
description: node, pnpm, uv and both dependency trees
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: apps/collector/uv.lock
    - run: uv --project apps/collector sync --frozen --all-groups
      shell: bash
